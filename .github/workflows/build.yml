name: Build KiemBayXuatHon

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: maven

  - name: Build plugin
    run: mvn -B clean package

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: KiemBayXuatHon-JAR
      path: target/*.jar
```
